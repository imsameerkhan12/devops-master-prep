name: CI

on:
pull_request:
paths:
- "app/s3-lister/**"

push:
branches:
- main
paths:
- "app/s3-lister/**"

concurrency:
group: ci-${{ github.ref }}
cancel-in-progress: true

env:
AWS_REGION: us-east-1

jobs:
lint-and-deploy:
name: Lint + Deploy
runs-on: arc-runner-set

```
permissions:
  id-token: write
  contents: read

steps:
  - name: Checkout
    uses: actions/checkout@v4

  # ARC/self-hosted runner image is minimal
  # Install AWS CLI into user space (no sudo required)
  - name: Install AWS CLI
    run: |
      curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
      unzip -q awscliv2.zip

      ./aws/install \
        --bin-dir $HOME/.local/bin \
        --install-dir $HOME/.local/aws-cli \
        --update

      echo "$HOME/.local/bin" >> $GITHUB_PATH

      aws --version

  - name: Configure AWS Credentials (OIDC)
    uses: aws-actions/configure-aws-credentials@v4
    with:
      role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      aws-region: ${{ env.AWS_REGION }}

  - name: Setup kubectl
    uses: azure/setup-kubectl@v4

  - name: Setup Helm
    uses: azure/setup-helm@v4

  - name: Update kubeconfig
    run: |
      aws eks update-kubeconfig \
        --name ${{ vars.CLUSTER_NAME }} \
        --region ${{ env.AWS_REGION }}

  - name: Helm Lint
    run: helm lint app/s3-lister/chart

  - name: Helm Template
    run: |
      helm template s3-lister app/s3-lister/chart \
        --set "image.init=${{ vars.ECR_REGISTRY }}/docker-hub/amazon/aws-cli:latest" \
        --set "image.nginx=${{ vars.ECR_REGISTRY }}/docker-hub/library/nginx:alpine"

  - name: Deploy s3-lister
    if: github.ref == 'refs/heads/main'
    run: |
      helm upgrade --install s3-lister app/s3-lister/chart \
        -n default \
        --create-namespace \
        --set "image.init=${{ vars.ECR_REGISTRY }}/docker-hub/amazon/aws-cli:latest" \
        --set "image.nginx=${{ vars.ECR_REGISTRY }}/docker-hub/library/nginx:alpine" \
        --atomic \
        --timeout=3m

  - name: Verify deploy
    if: github.ref == 'refs/heads/main'
    run: |
      kubectl rollout status deployment/s3-lister \
        -n default \
        --timeout=2m
```
