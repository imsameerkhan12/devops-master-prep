name: CI

on:
  pull_request:
    paths:
      - "app/s3-lister/**"

  push:
    branches:
      - main
    paths:
      - "app/s3-lister/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  # ── Job 1: Lint + Template — runs on every PR and push ──────────────────────
  lint:
    name: Helm Lint + Template
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: helm lint app/s3-lister/chart

      - name: Helm Template
        run: |
          helm template s3-lister app/s3-lister/chart \
            --set image.init=${{ vars.ECR_REGISTRY }}/docker-hub/amazon/aws-cli:latest \
            --set image.nginx=${{ vars.ECR_REGISTRY }}/docker-hub/library/nginx:alpine

  # ── Job 2: Deploy — only on merge to main ───────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      id-token: write   # OIDC token for AWS credential federation
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"

      # --atomic = waits for rollout + auto-rollback on failure
      - name: Deploy s3-lister
        run: |
          helm upgrade --install s3-lister app/s3-lister/chart \
            --namespace default \
            --create-namespace \
            --set image.init=${{ vars.ECR_REGISTRY }}/docker-hub/amazon/aws-cli:latest \
            --set image.nginx=${{ vars.ECR_REGISTRY }}/docker-hub/library/nginx:alpine \
            --atomic \
            --timeout 3m