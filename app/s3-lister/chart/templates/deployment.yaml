apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "s3-lister.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "s3-lister.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "s3-lister.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}

      initContainers:
        - name: s3-fetch
          image: {{ .Values.image.init }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "<html>
              <head><title>S3 Lister — Pod Identity Demo</title>
              <style>body{font-family:sans-serif;max-width:600px;margin:40px auto;padding:20px}
              h1{color:#232f3e}li{margin:8px 0;font-size:18px}</style></head>
              <body>
              <h1>S3 Buckets</h1>
              <p>Listed using <strong>Pod Identity</strong> — no hardcoded credentials</p>
              <ul>" > /html/index.html
              aws s3 ls --region $AWS_REGION | awk '{print "<li>"$3"</li>"}' >> /html/index.html
              echo "</ul>
              <hr><small>Pod: $HOSTNAME | SA: {{ .Values.serviceAccount.name }}</small>
              </body></html>" >> /html/index.html
          env:
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.aws.region | quote }}
          volumeMounts:
            - name: html
              mountPath: /html

      containers:
        - name: nginx
          image: {{ .Values.image.nginx }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
        - name: html
          emptyDir: {}
