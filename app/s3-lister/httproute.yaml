---
# Gateway — Traefik ka entry point
# GatewayClass "traefik" se linked — Traefik isko handle karega
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: traefik
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All   # Sabhi namespaces ke routes allow karo

---
# HTTPRoute — traffic routing rules
# / → s3-lister service pe forward karo
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: s3-lister
  namespace: default
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik      # Gateway kahan hai
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: s3-lister     # Service name
          port: 80
