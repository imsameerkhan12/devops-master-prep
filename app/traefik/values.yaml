# Traefik Helm Values
# Cloud-agnostic ingress controller — Gateway API support
# Install: helm install traefik traefik/traefik -n traefik --create-namespace -f app/traefik/values.yaml

# ECR pull-through cache — private subnet mein Docker Hub image pull hoti hai via VPC endpoint
# registry = 271169999916.dkr.ecr.us-east-1.amazonaws.com
# repository = docker-hub/library/traefik (pull-through cache prefix = docker-hub)
# account ID apna daalo
image:
  # Override on deploy: --set image.registry=<account-id>.dkr.ecr.<region>.amazonaws.com
  registry: "ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com"
  repository: "docker-hub/library/traefik"
  tag: "v3.7.1"

# Gateway API mode — modern standard (Ingress ka replacement)
providers:
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true

# Gateway — Traefik apna banata hai, sab namespace ke routes allow karo
# namespacePolicy.from: All = default namespace ke HTTPRoute bhi attach ho sakein
gateway:
  name: traefik-gateway
  listeners:
    web:
      protocol: HTTP
      namespacePolicy:
        from: All

gatewayClass:
  enabled: true
  name: traefik

# NLB — in-tree cloud controller ke saath compatible
# "external" + "ip" annotations ko AWS Load Balancer Controller chahiye (hum install nahi kar rahe)
# "nlb" = in-tree controller, instance target type — simpler, no extra controller needed
service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"

ports:
  web:
    port: 8000
    exposedPort: 80
    protocol: TCP
