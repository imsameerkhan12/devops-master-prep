# ARC RunnerSet — gha-runner-scale-set Helm values
# Each runner = ephemeral pod — spawns on job trigger, dies after job completes
# Namespace: arc-runners
# Install: helm upgrade --install arc-runner-set oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
#          -n arc-runners --create-namespace -f app/arc/runner-values.yaml
#          --version 0.14.0

# GitHub App auth — secret created by bootstrap workflow
githubConfigUrl: "https://github.com/imsameerkhan12/devops-master-prep"
githubConfigSecret: "arc-github-app-secret"

# Scale to zero when idle — no cost when no jobs are queued
minRunners: 0
maxRunners: 5

# NO dind — CI workflow only runs kubectl/helm/aws CLI, zero docker commands.
# dind adds a privileged sidecar that wastes RAM on t3.medium and introduces
# a startup race condition. Only enable dind if you add docker build/push steps.

template:
  spec:
    containers:
      - name: runner
        # latest = always satisfies GitHub's enforced minimum-version floor.
        # Pinning a specific version risks the runner registering then
        # immediately exiting if GitHub's floor has moved past that version.
        image: "ghcr.io/actions/actions-runner:latest"

        # Resource limits are required on t3.medium (2vCPU / 4GB).
        # Without limits the runner can be OOMKilled before it picks up a job.
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1500m"
            memory: "2Gi"
